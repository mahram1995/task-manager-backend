
server:
  port: 8050
  servlet:
    context-path: /task-manager-service

spring:
  datasource:
    url: jdbc:oracle:thin:@YOUR_DB_HOST:1521/YOUR_SERVICE_NAME
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins:
      - https://yourdomain.com
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  app:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 28800000
