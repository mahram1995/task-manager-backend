
server:
  port: 8050
  servlet:
    context-path: /task-manager-service

spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:xe
    driver-class-name: oracle.jdbc.OracleDriver
    username: hims
    password: root

  jpa:
    hibernate:
      ddl-auto: update

app:
  cors:
    allowed-origins:
      - http://localhost:4300
      - http://localhost:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50T25seVNlY3JldEtleUZvckRhaWx5VGFza0FwcA==}
    expiration-ms: 28800000
