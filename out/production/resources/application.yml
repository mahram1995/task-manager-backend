spring:
  application:
    name: task-manager-service
  profiles:
    default: dev

  #  datasource:
  #    url: jdbc:oracle:thin:@localhost:1521:xe
  #    driver-class-name: oracle.jdbc.OracleDriver
  #    username: hims
  #    password: root

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 500

app:
