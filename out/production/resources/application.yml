    secret: ${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50T25seVNlY3JldEtleUZvckRhaWx5VGFza0FwcA==}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}

